<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="店小秘发货导出助手">
  
  <!--
  ================================================================
  店小秘发货导出助手 · 浏览器扩展图标 · 主稿  (定稿参数)
  ================================================================
  概念 · 出格 (Chu-Ge)
    汉字「出」的几何减笔。三重语义：
      1) 出 = 导出 / 出货 / 取出去 —— 与工具唯一的动作完全同义
      2) 三竖栏 = 发货单列表的「行」；两横档 = 「格」
      3) 中栏上探 = 数据被「取出」的方向感（不画箭头，避开俗套）
    减笔依据：字体里的「出」= 三条竖栏 + 两道横档、顶部开口。
    本稿去掉书写味（撇捺 / 粗细变化 / 衬线），只留骨架并全圆端。

  ================================================================
  三声明
  ================================================================
  ① 比例系统 · 整数比（模数 M = 8，画布 1024 = 128M）
     画布              1024 = 128M        笔宽 SW            128 = 16M
     端帽半径            64 =   8M        字形视觉外框       672 =  84M
     四边留白            176 =  22M       竖栏心 x      240 / 512 / 784
     竖栏间距            272 =  34M       中栏长        240 → 784 = 544 = 68M
     侧栏长              304 → 784 = 480 = 60M
     两档三等分          480 / 3 = 160 = 20M （档 y = 464 / 624）
     → 10 个以上关键尺寸落在 8px 模数上，可逐个代入复验

  ② 风格语法 · 圆端
     端帽与转角全部取满圆（r = SW/2 = 64），全局无锐角、无直角。
     位于「圆 / 圆角 / 直角 / 锐角」连续谱的圆端一侧，与面板 UI
     （#2B6CFF 圆角卡片）同一语言。

  ③ 元素预算 · 2
     ① 字形（出） ② 底板。主角唯一。
     删减测试：去底板 → 图形仍成立（变体 02）；去中栏 → 读成「目」，语义丢失 → 中栏保留。

  ================================================================
  光学修正（3 处，可复现）
  ================================================================
  a. 中栏上探 64 = 8M —— 令顶部不读成呆板横线，并给出「取出」的方向；
     上探后中栏视觉顶点 = 176，与左右/下留白同值 → 四边留白等重。
  b. 横档端帽与竖栏外缘相切 —— 横档画到栏心 240 / 784，圆头端帽 r=64
     正好抵达 176 / 848，与竖栏外缘重合：端头不外凸、也不缺口。
  c. 无 overshoot —— 本字形以横竖直线为主、无弧线外轮廓，不触发曲线越基线修正。

  ================================================================
  尺寸链（可直接代入验证）
  ================================================================
    竖栏外缘 176 → 848  = 672 = 84M        中栏 240 → 784 = 544
    侧栏 304 → 784 = 480 = 3 × 160          档 464 / 624 → 304+160 / +160 ✔
    字形视觉外框 672 × 672，画布 1024 居中 → 四边留白 176，等重 ✔
    留白 / 字形 = 176 / 672 = 0.2619 ≈ 1 : 3.818  （声明值复算误差 0.0%）
  ================================================================
  -->
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/></clipPath>
  </defs>

  <!-- ② 底板 -->
  

  <!-- ① 字形「出」：三栏两档，SW=128，全圆端 -->
  <g fill="none" stroke="#111111" stroke-width="128" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 240 V784"/>   <!-- 中栏：上探 64 -->
    <path d="M240 304 V784"/>   <!-- 左栏 -->
    <path d="M784 304 V784"/>   <!-- 右栏 -->
    <path d="M240 464 H784"/>   <!-- 上档 -->
    <path d="M240 624 H784"/>   <!-- 下档 -->
  </g>
</svg>
